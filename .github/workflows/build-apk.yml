name: Build AL Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease :appbar:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; then
            # Surface the real errors as annotations so they show on the run page
            grep -E "error:|e: |What went wrong|Could not|FAILURE|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk AL-Studio.apk
          cp appbar/build/outputs/apk/release/appbar-release.apk AL-Studio-AppBar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AL-Studio-APK
          path: |
            AL-Studio.apk
            AL-Studio-AppBar.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AL Studio build ${{ github.run_number }}
          files: |
            AL-Studio.apk
            AL-Studio-AppBar.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
