plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alstudio.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alstudio.launcher'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.1'
    }

    // One fixed key, so every new build installs as an update over the last one.
    signingConfigs {
        alstudio {
            storeFile file('alstudio.keystore')
            storePassword 'alstudio123'
            keyAlias 'alstudio'
            keyPassword 'alstudio123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.alstudio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint { abortOnError false }
}

dependencies {
    // Official WireGuard tunnel library, used for the VPN
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}
