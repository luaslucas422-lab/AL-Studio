<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL Studio</title>
<style>
:root{
  --accent:#4f8cff;
  --tile-w:216px; --tile-h:122px; --app-w:112px; --radius:18px;
  --fg:#f4f6fb; --muted:rgba(244,246,251,.62); --faint:rgba(244,246,251,.38);
  --glass:rgba(16,18,28,.58); --glass-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --speed:1;
  --font:"Segoe UI Variable","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#07080d;color:var(--fg);font-family:var(--font);overflow-x:hidden;user-select:none;-webkit-user-select:none}
body.font-rounded{--font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",Quicksand,system-ui,sans-serif}
body.font-classic{--font:Georgia,"Noto Serif","Times New Roman",serif}
body.font-mono{--font:ui-monospace,"Roboto Mono","Cascadia Mono",Consolas,monospace}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus,:focus-visible{outline:none}

/* ---------- Wallpaper ---------- */
#wall{position:fixed;inset:-40px;z-index:-2;background-size:cover;background-position:center;transition:filter .4s}
body.wp-blur #wall{filter:blur(18px) saturate(1.15)}
body.wp-anim #wall:not(.photo){background-size:160% 160%;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
#scrim{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,calc(var(--dim)*.2)) 0%,rgba(0,0,0,calc(var(--dim)*.6)) 50%,rgba(0,0,0,calc(.35 + var(--dim)*.5)) 100%)}
body{--dim:.6}
.wp-aurora{background:radial-gradient(60% 70% at 15% 10%,#3b2a8f 0%,transparent 60%),radial-gradient(55% 60% at 90% 20%,#0d6e7a 0%,transparent 60%),radial-gradient(70% 70% at 60% 100%,#1a1f5c 0%,transparent 70%),#080a14}
.wp-ember{background:radial-gradient(60% 70% at 10% 0%,#a2361b 0%,transparent 60%),radial-gradient(60% 60% at 95% 30%,#7a1d4a 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#3a1408 0%,transparent 70%),#120806}
.wp-ocean{background:radial-gradient(60% 70% at 20% 10%,#0b4f8a 0%,transparent 60%),radial-gradient(60% 60% at 85% 40%,#0a6b6b 0%,transparent 60%),radial-gradient(70% 70% at 40% 110%,#06213f 0%,transparent 70%),#050b16}
.wp-forest{background:radial-gradient(60% 70% at 15% 5%,#1f6b3a 0%,transparent 60%),radial-gradient(60% 60% at 90% 35%,#5b6b12 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#0b2a17 0%,transparent 70%),#06100a}
.wp-dusk{background:radial-gradient(60% 70% at 10% 10%,#8a2a6e 0%,transparent 60%),radial-gradient(60% 60% at 90% 25%,#3b2f9c 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#2b0f3a 0%,transparent 70%),#0d0712}
.wp-glacier{background:radial-gradient(60% 70% at 20% 0%,#2f6f9e 0%,transparent 60%),radial-gradient(60% 60% at 85% 30%,#6c7fb8 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#16243a 0%,transparent 70%),#0a0f18}
.wp-midnight{background:radial-gradient(80% 80% at 50% 0%,#1a1d27 0%,#07080c 70%)}
.wp-oled{background:#000}

/* ---------- Layout ---------- */
main{padding:22px clamp(16px,4vw,56px) 72px;max-width:1800px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:650;letter-spacing:.2px;font-size:18px}
.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 35%,#0b1030));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.mark svg{width:30px;height:30px}
.preview-chip{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:99px;margin-left:4px}
.top-actions{display:flex;gap:8px;align-items:center}
.status{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.pill svg{width:14px;height:14px}
.pill.ok{background:color-mix(in srgb,#22c55e 22%,transparent);border-color:color-mix(in srgb,#22c55e 45%,transparent)}
.pill.busy{background:color-mix(in srgb,#f59e0b 22%,transparent);border-color:color-mix(in srgb,#f59e0b 45%,transparent)}
.icon-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);transition:transform calc(.15s*var(--speed)),background .15s,box-shadow .15s}
.icon-btn svg{width:22px;height:22px}
.icon-btn.focused,.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn.focused{box-shadow:0 0 0 3px var(--accent);transform:scale(1.06)}

.hero{padding:clamp(18px,5vh,56px) 4px clamp(10px,3vh,28px)}
.greet{font-size:clamp(16px,1.6vw,22px);color:var(--muted);margin-bottom:4px}
.clock{font-size:clamp(56px,9vw,124px);font-weight:300;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.clock small{font-size:.36em;letter-spacing:0;color:var(--muted);margin-left:6px}
.date{font-size:clamp(15px,1.4vw,20px);color:var(--muted);margin-top:8px}
body.clock-small .clock{font-size:clamp(36px,4.5vw,60px);letter-spacing:-1px}
body.clock-small .hero{padding-top:clamp(12px,3vh,30px)}
body.clock-hidden .clock,body.clock-hidden .date{display:none}
body.clock-hidden.no-greet .hero{display:none}
body.no-greet .greet{display:none}

.row{margin-top:clamp(12px,2.6vh,26px)}
.row-head{display:flex;align-items:center;gap:12px;margin:0 4px 6px}
.row-head h2{font-size:clamp(15px,1.3vw,19px);font-weight:600;margin:0;color:rgba(255,255,255,.88)}
.row-head .count{font-size:13px;color:var(--faint)}
.row-head .grow{flex:1}
.chip{height:34px;padding:0 14px;border-radius:99px;font-size:14px;background:var(--glass-2);border:1px solid var(--line);transition:all calc(.15s*var(--speed));white-space:nowrap}
.chip.focused,.chip:hover{background:rgba(255,255,255,.16)}
.chip.focused{box-shadow:0 0 0 3px var(--accent)}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}

.strip{display:flex;gap:16px;overflow-x:auto;padding:14px 14px 18px;margin:0 -8px;scroll-padding:0 40px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}

/* ---------- Tiles ---------- */
.tile{position:relative;flex:0 0 auto;width:var(--tile-w);height:var(--tile-h);border-radius:var(--radius);overflow:hidden;text-align:left;
  background:linear-gradient(135deg,var(--c1,#334),var(--c2,#112));
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);
  transition:transform calc(.18s*var(--speed)) cubic-bezier(.2,.8,.2,1),box-shadow calc(.18s*var(--speed))}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent 45%);pointer-events:none}
body.tiles-glass .tile:not(.add){background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,rgba(255,255,255,.08)),rgba(255,255,255,.04));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.14)}
body.tiles-solid .tile:not(.add){background:var(--c2)}
body.tiles-solid .tile::after{display:none}
body.shape-square{--radius:6px}
body.shape-round{--radius:30px}
.tile .ico{position:absolute;left:14px;top:14px;width:46px;height:46px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;overflow:hidden}
.tile .ico.img{background:rgba(255,255,255,.96)}
.tile .ico.img img{width:30px;height:30px;object-fit:contain}
.tile .ico.appimg{background:transparent;border-radius:0}
.tile .ico.appimg img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.tile .ico.glyph{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tile .ico.glyph svg{width:26px;height:26px;color:#fff}
.tile .name{position:absolute;left:14px;right:14px;bottom:12px;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.tile .badge{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.32);color:rgba(255,255,255,.9)}
.tile .badge.get{background:#fff;color:#111}
.tile.focused,.tile:hover{transform:scale(1.07);z-index:2}
.tile.focused{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 16px 40px rgba(0,0,0,.55)}
.tile.add{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.25);box-shadow:none;display:grid;place-items:center;color:var(--muted)}
.tile.add::after{display:none}
.tile.add span{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.tile.add svg{width:30px;height:30px}
.tile.site{height:calc(var(--tile-h)*.8)}
.tile.site .ico{width:38px;height:38px;left:12px;top:12px}
.tile.site .ico.img img{width:24px;height:24px}
.tile.site .ico.glyph svg{width:22px;height:22px}
.tile.site .name{font-size:15px;bottom:10px;left:12px}
.editing .tile:not(.add){animation:wiggle .5s ease-in-out infinite alternate}
.editing .tile:not(.add) .badge{background:var(--accent);color:#fff}
@keyframes wiggle{from{rotate:-.7deg}to{rotate:.7deg}}

/* ---------- Quick settings ---------- */
.qs-btn{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform calc(.15s*var(--speed)),box-shadow .15s,background .15s;white-space:nowrap}
.qs-btn svg{width:22px;height:22px;opacity:.9}
.qs-btn.focused,.qs-btn:hover{background:rgba(255,255,255,.14)}
.qs-btn.focused{box-shadow:0 0 0 3px var(--accent);transform:scale(1.05)}
.qs-btn.on{background:color-mix(in srgb,var(--accent) 35%,var(--glass));border-color:color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---------- All apps ---------- */
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);min-width:0;width:min(280px,46vw)}
.search svg{width:16px;height:16px;opacity:.6;flex:none}
.search input{background:none;border:0;outline:0;width:100%;font-size:14px}
.search.focused{box-shadow:0 0 0 3px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--app-w),1fr));gap:12px;padding:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;transition:transform calc(.15s*var(--speed)),background .15s,box-shadow .15s}
.aico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(0,0,0,.35)}
.aico svg{width:28px;height:28px;color:#fff}
.aico.has-img{background:none;box-shadow:none}
.aico img{width:56px;height:56px;object-fit:contain}
.app .aname{font-size:13px;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:rgba(255,255,255,.9)}
.app.focused,.app:hover{background:rgba(255,255,255,.1)}
.app.focused{box-shadow:0 0 0 3px var(--accent);transform:scale(1.06)}
.empty{color:var(--muted);padding:18px 8px;font-size:14px}
.editing-apps .app .aico{outline:2px dashed var(--accent);outline-offset:3px}

/* ---------- App loading splash ---------- */
#loader{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:radial-gradient(60% 60% at 50% 45%,color-mix(in srgb,var(--lc1,#334) 55%,#05060a) 0%,#05060a 75%)}
#loader.open{display:grid;animation:fade calc(.25s*var(--speed)) ease}
.load-box{display:flex;flex-direction:column;align-items:center;gap:22px}
.load-icon{width:132px;height:132px;border-radius:34px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,var(--lc1),var(--lc2));box-shadow:0 30px 80px color-mix(in srgb,var(--lc1) 45%,transparent);animation:breathe 1.6s ease-in-out infinite}
.load-icon.has-img{background:rgba(255,255,255,.06)}
.load-icon img{width:96px;height:96px;object-fit:contain}
.load-icon svg{width:64px;height:64px;color:#fff}
.load-icon::before{content:"";position:absolute;inset:-14px;border-radius:44px;border:3px solid transparent;border-top-color:rgba(255,255,255,.85);border-right-color:rgba(255,255,255,.25);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
.load-name{font-size:28px;font-weight:650}
.load-sub{color:var(--muted);font-size:15px;margin-top:-14px}
.load-bar{width:220px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.load-bar i{display:block;height:100%;width:40%;border-radius:9px;background:#fff;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}

/* ---------- Layers ---------- */
.layer{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.layer.open{display:flex;animation:fade calc(.18s*var(--speed)) ease}
@keyframes fade{from{opacity:0}}
.dlg{width:min(480px,100%);max-height:90vh;overflow:auto;background:rgba(22,24,36,.97);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop calc(.2s*var(--speed)) cubic-bezier(.2,.8,.2,1)}
.dlg.wide{width:min(640px,100%)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg h3{margin:0 0 4px;font-size:20px}
.dlg p.sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input:not([type=color]){width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 14px;font-size:16px;outline:0}
.field input.focused{box-shadow:0 0 0 3px var(--accent)}
.sheet-list{display:flex;flex-direction:column;gap:8px}
.sheet-btn{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.06);font-size:16px;text-align:left;transition:background .15s,box-shadow .15s}
.sheet-btn svg{width:20px;height:20px;opacity:.85;flex:none}
.sheet-btn img{width:32px;height:32px;object-fit:contain;flex:none}
.sheet-btn.focused,.sheet-btn:hover{background:rgba(255,255,255,.14)}
.sheet-btn.focused{box-shadow:0 0 0 3px var(--accent)}
.sheet-btn.danger{color:#ff8a8a}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn{height:44px;padding:0 20px;border-radius:12px;background:rgba(255,255,255,.08);font-weight:600;transition:all .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.focused,.btn:hover{filter:brightness(1.15)}
.btn.focused{box-shadow:0 0 0 3px #fff}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px}
.gbtn{height:58px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:all .15s}
.gbtn svg{width:26px;height:26px}
.gbtn[aria-pressed="true"]{background:var(--accent)}
.gbtn.focused,.gbtn:hover{background:rgba(255,255,255,.18)}
.gbtn.focused{box-shadow:0 0 0 3px var(--accent)}
.list-scroll{max-height:56vh;overflow:auto;padding:4px}

/* Settings panel */
#settings{justify-content:flex-end;padding:0}
.panel{width:min(600px,100%);height:100%;overflow-y:auto;background:rgba(13,15,23,.97);border-left:1px solid var(--line);padding:24px 24px 70px;animation:slide calc(.22s*var(--speed)) cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-head h3{margin:0;font-size:24px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 10px;scrollbar-width:none;position:sticky;top:-24px;background:rgba(13,15,23,.97);z-index:2;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.group{margin-top:20px}
.group h4{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px;text-align:left;font-size:15px;transition:background .15s,box-shadow .15s}
.opt .hint{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt .right{flex:none;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.opt.focused,.opt:hover{background:rgba(255,255,255,.11)}
.opt.focused{box-shadow:0 0 0 3px var(--accent)}
.opt.danger{color:#ff8a8a}
.opt .lead{display:flex;align-items:center;gap:12px}
.opt .lead .flag{font-size:26px;line-height:1}
.toggle{flex:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-pressed="true"] .toggle{background:var(--accent)}
[aria-pressed="true"] .toggle::after{transform:translateX(18px)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:42px;height:42px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff}
.sw.focused,.sw:hover{transform:scale(1.15)}
.sw.focused{box-shadow:0 0 0 3px var(--accent),0 0 0 6px #fff}
.sw.custom{background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.wp{height:64px;border-radius:12px;position:relative;overflow:hidden;font-size:12px;font-weight:600;display:flex;align-items:flex-end;padding:6px 8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .15s,box-shadow .15s;background-size:cover;background-position:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wp[aria-pressed="true"]{box-shadow:0 0 0 3px #fff}
.wp.focused,.wp:hover{transform:scale(1.05)}
.wp.focused{box-shadow:0 0 0 3px var(--accent),0 0 0 6px #fff}
.wp.upload{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);justify-content:center;align-items:center}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);font-weight:600;font-size:14px;transition:all .15s;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button.focused{box-shadow:0 0 0 3px #fff}
.seg-label{font-size:14px;margin:14px 2px 8px;color:rgba(255,255,255,.85)}
.card{border-radius:14px;background:rgba(255,255,255,.05);padding:14px 16px;margin-bottom:8px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.85)}
.card b{color:#fff}
.card.note{border:1px solid var(--line);background:rgba(255,255,255,.03)}
.statusline{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#6b7280;flex:none}
.dot.ok{background:#22c55e;box-shadow:0 0 10px #22c55e}
.dot.busy{background:#f59e0b;animation:blink 1s infinite}
.dot.err{background:#ef4444}
@keyframes blink{50%{opacity:.3}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}

const $ = s => document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") n.className = v;
    else if(k==="style") n.style.cssText = v;
    else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if(v===true) n.setAttribute(k,"");
    else if(v!==false && v!=null) n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid==null || kid===false) continue; n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
}
function hashColor(s){ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return TILE_COLORS[h % TILE_COLORS.length]; }

    ctx = new AC();
    master = ctx.createGain(); master.connect(ctx.destination);
    // small generated "air" reverb
    verb = ctx.createConvolver(); verbGain = ctx.createGain(); verbGain.gain.value = .28;
    const len = ctx.sampleRate * 1.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
    verb.buffer = ir; verb.connect(verbGain); verbGain.connect(master);
    return ctx;
  }
  function unlock(){ const c = init(); if(c && c.state === "suspended") c.resume(); }
  function tone(f, t, dur, g, opt={}){
    const o = ctx.createOscillator(), a = ctx.createGain(), now = ctx.currentTime + t;
    o.type = opt.type || "sine"; o.frequency.setValueAtTime(f, now);
    if(opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, now + dur);
    const atk = opt.atk || .004;
    a.gain.setValueAtTime(0, now); a.gain.linearRampToValueAtTime(g, now + atk); a.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(a); a.connect(master); if(opt.wet !== false) a.connect(verb);
    o.start(now); o.stop(now + dur + .05);
  }
  const PACKS = {
    airy: {
      move(){ tone(2093,0,.06,.16); tone(4186,0,.035,.04); },
      select(){ tone(1318.5,0,.14,.22); tone(1975.5,.045,.2,.16); },
      back(){ tone(987.8,0,.12,.18); tone(659.3,.05,.18,.16); },
      launch(){ [523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,i*.055,.6,.13)); tone(2093,.24,.9,.05); },
      toggle(){ tone(1568,0,.09,.2); tone(2349,.03,.08,.07); },
      error(){ tone(311,0,.13,.22,{type:"triangle",wet:false}); tone(261.6,.12,.18,.22,{type:"triangle",wet:false}); },
      start(){ [392,523.3,659.3,784].forEach((f,i)=>tone(f,i*.09,2.2,.075,{atk:.35})); tone(1568,.5,1.8,.03,{atk:.4}); }
    },
    classic: {
      move(){ tone(1400,0,.025,.12,{type:"square",wet:false}); },
      select(){ tone(900,0,.05,.14,{type:"square",wet:false}); tone(1350,.04,.05,.1,{type:"square",wet:false}); },
      back(){ tone(700,0,.05,.13,{type:"square",wet:false}); tone(500,.04,.06,.1,{type:"square",wet:false}); },
      launch(){ [660,880,1320].forEach((f,i)=>tone(f,i*.06,.12,.1,{type:"square",wet:false})); },
      toggle(){ tone(1100,0,.04,.12,{type:"square",wet:false}); },
      error(){ tone(220,0,.18,.16,{type:"square",wet:false}); },
      start(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.18,.09,{type:"square",wet:false})); }
    },
    soft: {
      move(){ tone(720,0,.07,.2,{to:520,wet:false}); },
      select(){ tone(880,0,.12,.26,{to:560}); },
      back(){ tone(560,0,.12,.22,{to:380}); },
      launch(){ tone(440,0,.35,.22,{to:880}); tone(660,.08,.4,.12,{to:1320}); },
      toggle(){ tone(980,0,.08,.2,{to:700,wet:false}); },
      error(){ tone(300,0,.25,.24,{to:180,wet:false}); },
      start(){ tone(330,0,1.2,.12,{to:660,atk:.3}); tone(495,.15,1.2,.08,{to:990,atk:.3}); }
    }
  };
  async function loadCustom(name){
    const url = S.sound.custom[name]; if(!url || !init()) return null;
    if(custom[name] && custom[name].url === url) return custom[name].buf;
    try{
      const ab = await (await fetch(url)).arrayBuffer();
      const buf = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
      custom[name] = {url, buf}; return buf;
    }catch(e){ return null; }
  }
  let lastMove = 0;
  function play(name){
    const vol = VOL[S.sound.vol] ?? .45;
    if(S.sound.pack === "off" || !vol) return;
    if(name === "move"){ if(!S.sound.nav) return; const n = performance.now(); if(n - lastMove < 45) return; lastMove = n; }
    if(!init()) return;
    if(ctx.state === "suspended") ctx.resume();
    master.gain.value = vol;
    if(S.sound.custom[name]){
      loadCustom(name).then(buf => { if(!buf) return; const src = ctx.createBufferSource(); src.buffer = buf; src.connect(master); src.start(); });
      return;
    }
    const pack = PACKS[S.sound.pack] || PACKS.airy;
    pack[name] && pack[name]();
  }

function resolveApp(f){
  if(f.pkg){ return APPS.find(a => a.pkg === f.pkg) || null; }
  const w = f.want; if(!w) return null;
  if(w.pkgs){ for(const p of w.pkgs){ const hit = APPS.find(a => a.pkg === p); if(hit) return hit; } }
  if(w.match){ const re = new RegExp(w.match, "i"); return APPS.find(a => re.test(a.name)) || null; }
  return null;
}
function itemColors(f){ return f.c1 ? [f.c1, f.c2] : hashColor(f.name); }
function displayName(f){ const r = f.kind==="app" ? resolveApp(f) : null; return (f.want && f.want.useAppName && r) ? r.name : f.name; }
// Returns {type:"img"|"appimg"|"glyph", src?, glyph}
function iconFor(f){
  if(f.iconMode === "glyph") return {type:"glyph", glyph:f.glyph || "grid"};
  if(f.kind === "app"){
    const r = resolveApp(f); const src = (r && r.icon) || f.icon;
    return src ? {type:"appimg", src} : {type:"glyph", glyph:f.glyph || "grid"};
  }
  const h = hostOf(f.url);
  return h ? {type:"img", src:`https://www.google.com/s2/favicons?sz=128&domain=${encodeURIComponent(h)}`, glyph:f.glyph || "globe"} : {type:"glyph", glyph:f.glyph || "globe"};
}
function iconNode(f, cls){

  const glyph = () => { box.className = cls + " glyph"; box.replaceChildren(svg(G[ic.glyph] || G.grid)); };
  if(ic.type === "glyph") glyph();
  else { const img = el("img",{alt:"", src:ic.src}); img.onerror = glyph; box.append(img); }
  return box;
}
function makeTile(f, i, list, row){

const layerStack = [], returnFocus = [];
function openLayer(id){
  const L = $("#"+id);

  requestAnimationFrame(() => { const first = navItems()[0]; first && focusEl(first, true); });

  const L = layerStack.pop(); if(!L) return false;

  const back = returnFocus.pop();
  if(back && document.contains(back) && back.getClientRects().length) focusEl(back, true); else { const f = navItems()[0]; f && focusEl(f, true); }
  return true;
}

function longPress(node, fn){
  let t = null, fired = false, sx=0, sy=0;
  node.addEventListener("pointerdown", e => { fired=false; sx=e.clientX; sy=e.clientY; t = setTimeout(() => { fired = true; Sound.play("select"); fn(); }, 550); });
  const cancel = () => clearTimeout(t);
  node.addEventListener("pointerup", cancel); node.addEventListener("pointerleave", cancel); node.addEventListener("pointercancel", cancel);
  node.addEventListener("pointermove", e => { if(Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10) cancel(); });
  node.addEventListener("click", e => { if(fired){ e.stopImmediatePropagation(); e.preventDefault(); fired=false; } }, true);
  node.addEventListener("contextmenu", e => { e.preventDefault(); if(!fired){ clearTimeout(t); fn(); } });
}

function focusEl(n, silent){

  document.querySelectorAll(".focused").forEach(x => x.classList.remove("focused"));
  n.focus({preventScroll:true});
  n.classList.add("focused");
  if(n.closest(".search")) n.closest(".search").classList.add("focused");
  n.scrollIntoView({block:"nearest", inline:"nearest", behavior: S.motion==="off" ? "auto" : "smooth"});
  if(!layerStack.length){

  if(changed && !silent) Sound.play("move");
}

function move(dir){
  const items = navItems(); if(!items.length) return;
  const cur = document.activeElement;

  const r = cur.getBoundingClientRect(), x0 = r.left + r.width/2, y0 = r.top + r.height/2;
  let best = null, bestScore = Infinity;
  for(const n of items){
    if(n === cur) continue;
    const q = n.getBoundingClientRect(), x = q.left + q.width/2, y = q.top + q.height/2;
    const dx = x - x0, dy = y - y0;
    let primary, ortho;
    if(dir==="left"){ if(dx > -4) continue; primary = -dx; ortho = Math.abs(dy); }
    if(dir==="right"){ if(dx < 4) continue; primary = dx; ortho = Math.abs(dy); }
    if(dir==="up"){ if(dy > -4) continue; primary = -dy; ortho = Math.abs(dx); }
    if(dir==="down"){ if(dy < 4) continue; primary = dy; ortho = Math.abs(dx); }
    const horiz = dir==="left" || dir==="right";
    const overlap = horiz ? (q.top < r.bottom && q.bottom > r.top) : (q.left < r.right && q.right > r.left);
    if(overlap) ortho = 0;
    const score = primary + ortho * (horiz ? 4 : 1.5);
    if(score < bestScore){ bestScore = score; best = n; }
  }
  if(best) focusEl(best);
}
function optionsFor(n){ if(n && n._open){ Sound.play("select"); n._open(); return true; } return false; }
let okTimer = null, okHeld = false;
document.addEventListener("keydown", e => {
  if($("#loader").classList.contains("open")){ if(["Escape","Backspace","GoBack","BrowserBack"].includes(e.key)) hideSplash(); return; }
  const a = document.activeElement, inInput = a && a.matches && a.matches("input:not([type=color])");
  const map = {ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down"};
  if(map[e.key]){
    if(inInput && (e.key==="ArrowLeft" || e.key==="ArrowRight")) return;
    e.preventDefault(); move(map[e.key]); return;
  }
  if(e.key==="Escape" || e.key==="GoBack" || e.key==="BrowserBack" || (e.key==="Backspace" && !inInput)){
    e.preventDefault(); window.ALBack(); return;
  }
  if(e.key==="ContextMenu" || e.keyCode===82){ e.preventDefault(); optionsFor(a); return; }
  const isOk = e.key==="Enter" || e.keyCode===23 || e.keyCode===66;
  if(isOk && inInput){ if(a.id==="fUrl" || a.id==="fName") $("#fSave").click(); else a.blur(); return; }
  if(isOk && a && a.matches && a.matches("button, .sw.custom")){
    e.preventDefault();
    if(e.repeat) return;
    okHeld = false; clearTimeout(okTimer);
    if(a._open) okTimer = setTimeout(() => { okHeld = true; optionsFor(a); }, 600);
    else { a.matches(".sw.custom") ? a.querySelector("input").click() : a.click(); okTimer = null; }
  }
});
document.addEventListener("keyup", e => {
  const isOk = e.key==="Enter" || e.keyCode===23 || e.keyCode===66;
  if(!isOk || okTimer === null) return;
  clearTimeout(okTimer); okTimer = null;
  const a = document.activeElement;
  if(!okHeld && a && a._open) a.click();
});
window.ALBack = function(){
  if($("#loader").classList.contains("open")){ hideSplash(); return true; }
  if(closeTop()) return true;
  if(editMode){ editMode=false; renderRows(); renderApps(); Sound.play("back"); return true; }
  Sound.play("back");
  const t = $("#favs .tile"); t && focusEl(t, true); window.scrollTo({top:0, behavior:"smooth"});
  return true;
};
window.ALHome = function(){ hideSplash(); closeAll(); if(editMode){ editMode=false; renderRows(); renderApps(); } window.scrollTo({top:0, behavior:"smooth"}); const t=$("#favs .tile"); t && focusEl(t, true); };

/* =====================================================================
   Start
   ===================================================================== */
$("#brandMark").innerHTML = LOGO;
$("#settingsBtn").append(svg(UI.gear));
applyLook(); tick(); setInterval(tick, 1000);
renderRows(); renderQS(); renderApps(); onNet();
if(NATIVE){
  call("requestApps", false);
  try{ const st = JSON.parse(call("netStatus") || "null"); if(st) window.ALOnNet(st); }catch(e){}
}else{
  $("#previewChip").hidden = false;
  setTimeout(() => window.ALOnApps(SAMPLE_APPS), 300);
}
requestAnimationFrame(() => { const t = $("#favs .tile"); t && focusEl(t, true); window.scrollTo(0,0); });
setTimeout(() => Sound.play("start"), 400);
</script>
