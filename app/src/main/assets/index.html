<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL Studio</title>
<style>
/* Everything is designed on a 1920-wide TV canvas (#stage) and scaled to fit the screen. */
:root{
  --accent:#4f8cff; --safe:48px; --H:1080px; --k:1; --radius:20px; --speed:1;
  --fg:#f4f6fb; --muted:rgba(244,246,251,.64); --faint:rgba(244,246,251,.4);
  --glass:rgba(16,18,28,.55); --glass-2:rgba(255,255,255,.08); --line:rgba(255,255,255,.13);
  --font:"Segoe UI Variable","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{color:var(--fg);font-family:var(--font);user-select:none;-webkit-user-select:none}
body.font-rounded{--font:ui-rounded,"SF Pro Rounded",Nunito,"Varela Round",Quicksand,system-ui,sans-serif}
body.font-classic{--font:Georgia,"Noto Serif","Times New Roman",serif}
body.font-mono{--font:ui-monospace,"Roboto Mono","Cascadia Mono",Consolas,monospace}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus,:focus-visible{outline:none}
[hidden]{display:none!important}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#07080d}

/* ---------- Background ---------- */
#wall{position:absolute;inset:-60px;background-size:cover;background-position:center;transition:filter .4s}
body.wp-blur #wall{filter:blur(22px) saturate(1.15)}
body.wp-anim #wall:not(.photo){background-size:160% 160%;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.tint{position:absolute;inset:0;opacity:0;transition:opacity calc(.6s*var(--speed)) ease}
.tint.on{opacity:1}
#scrim{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,calc(.25 + var(--dim)*.45)) 0%,rgba(0,0,0,calc(var(--dim)*.25)) 55%,rgba(0,0,0,0) 100%),
  linear-gradient(180deg,rgba(0,0,0,calc(var(--dim)*.15)) 0%,rgba(0,0,0,calc(var(--dim)*.35)) 42%,rgba(0,0,0,calc(.45 + var(--dim)*.4)) 62%,rgba(0,0,0,calc(.55 + var(--dim)*.4)) 100%)}
body{--dim:.6}
.wp-aurora{background:radial-gradient(60% 70% at 15% 10%,#3b2a8f 0%,transparent 60%),radial-gradient(55% 60% at 90% 20%,#0d6e7a 0%,transparent 60%),radial-gradient(70% 70% at 60% 100%,#1a1f5c 0%,transparent 70%),#080a14}
.wp-ember{background:radial-gradient(60% 70% at 10% 0%,#a2361b 0%,transparent 60%),radial-gradient(60% 60% at 95% 30%,#7a1d4a 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#3a1408 0%,transparent 70%),#120806}
.wp-ocean{background:radial-gradient(60% 70% at 20% 10%,#0b4f8a 0%,transparent 60%),radial-gradient(60% 60% at 85% 40%,#0a6b6b 0%,transparent 60%),radial-gradient(70% 70% at 40% 110%,#06213f 0%,transparent 70%),#050b16}
.wp-forest{background:radial-gradient(60% 70% at 15% 5%,#1f6b3a 0%,transparent 60%),radial-gradient(60% 60% at 90% 35%,#5b6b12 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#0b2a17 0%,transparent 70%),#06100a}
.wp-dusk{background:radial-gradient(60% 70% at 10% 10%,#8a2a6e 0%,transparent 60%),radial-gradient(60% 60% at 90% 25%,#3b2f9c 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#2b0f3a 0%,transparent 70%),#0d0712}
.wp-glacier{background:radial-gradient(60% 70% at 20% 0%,#2f6f9e 0%,transparent 60%),radial-gradient(60% 60% at 85% 30%,#6c7fb8 0%,transparent 60%),radial-gradient(70% 70% at 50% 110%,#16243a 0%,transparent 70%),#0a0f18}
.wp-midnight{background:radial-gradient(80% 80% at 50% 0%,#1a1d27 0%,#07080c 70%)}
.wp-oled{background:#000}

/* ---------- Top bar ---------- */
#topbar{position:absolute;left:var(--safe);right:var(--safe);top:calc(var(--safe)*.6 + 8px);height:72px;display:flex;align-items:center;gap:18px;z-index:5}
.mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 35%,#0b1030));box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);flex:none}
.mark svg{width:42px;height:42px}
.navtabs{display:flex;gap:6px;margin-left:14px}
.navtab{height:56px;padding:0 26px;border-radius:99px;font-size:24px;font-weight:600;color:var(--muted);transition:all calc(.15s*var(--speed))}
.navtab.on{color:#fff;background:rgba(255,255,255,.12)}
.navtab.focused{color:#111;background:#fff;transform:scale(1.06)}
.grow{flex:1}
.status{display:flex;gap:10px}
.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:99px;font-size:18px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.pill svg{width:20px;height:20px}
.pill.ok{background:color-mix(in srgb,#22c55e 22%,transparent);border-color:color-mix(in srgb,#22c55e 45%,transparent)}
.pill.busy{background:color-mix(in srgb,#f59e0b 22%,transparent);border-color:color-mix(in srgb,#f59e0b 45%,transparent)}
.net-ico{width:30px;height:30px;opacity:.85}
.net-ico svg{width:30px;height:30px}
.top-time{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.icon-btn{width:60px;height:60px;border-radius:99px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);transition:all calc(.15s*var(--speed));flex:none}
.icon-btn svg{width:28px;height:28px}
.icon-btn.focused{background:#fff;color:#111;transform:scale(1.1);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---------- Home: hero ---------- */
.page{position:absolute;inset:0}
#hero{position:absolute;left:var(--safe);right:var(--safe);top:calc(var(--safe)*.6 + 100px);height:calc(var(--H)*.47 - var(--safe)*.6 - 112px);display:flex;align-items:flex-end;justify-content:space-between;gap:40px;pointer-events:none}
.hero-text{max-width:1050px;padding-bottom:6px;animation:heroIn calc(.35s*var(--speed)) cubic-bezier(.2,.8,.2,1)}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}}
.h-kicker{font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.h-title{font-size:76px;font-weight:700;line-height:1.02;letter-spacing:-1.5px;text-shadow:0 4px 30px rgba(0,0,0,.45)}
.h-desc{font-size:28px;color:rgba(255,255,255,.82);margin-top:14px;line-height:1.35;max-width:900px}
.h-hints{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:20px;color:var(--muted)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:34px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:17px}
.h-hints .key + span{margin-right:18px}
.h-greet{font-size:30px;color:var(--muted);margin-bottom:6px}
.h-clock{font-size:150px;font-weight:300;line-height:.95;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.h-clock small{font-size:.32em;letter-spacing:0;color:var(--muted);margin-left:10px}
.h-date{font-size:30px;color:var(--muted);margin-top:12px}
.hero-art{flex:none;width:300px;height:300px;display:grid;place-items:center;margin-bottom:-6px;animation:artIn calc(.45s*var(--speed)) cubic-bezier(.2,.8,.2,1)}
@keyframes artIn{from{opacity:0;transform:scale(.9) translateX(30px)}}
.art-box{width:260px;height:260px;border-radius:64px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 40px 100px color-mix(in srgb,var(--c1) 45%,transparent),inset 0 0 0 2px rgba(255,255,255,.14)}
.art-box svg{width:130px;height:130px;color:#fff}
.art-box.img{background:rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.art-box.img img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
.art-box.fav{background:#fff}
.art-box.fav img{width:140px;height:140px;filter:none}

/* ---------- Home: rows ---------- */
#rowsView{position:absolute;left:0;right:0;top:calc(var(--H)*.47);bottom:0;overflow:hidden}
#rows{transition:transform calc(.38s*var(--speed)) cubic-bezier(.2,.8,.2,1)}
.row{transition:opacity calc(.3s*var(--speed))}
.row.past{opacity:0}
.row h2{margin:0;padding:6px calc(var(--safe) + 6px) 0;font-size:26px;font-weight:600;color:rgba(255,255,255,.9);display:flex;align-items:baseline;gap:12px}
.count{font-size:20px;color:var(--faint);font-weight:500}
.strip{display:flex;gap:calc(26px*var(--k));overflow-x:auto;overflow-y:hidden;padding:22px var(--safe) 34px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}

.cell{flex:none;display:flex;flex-direction:column;gap:14px}
.clabel{font-size:21px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;transition:color .15s}
.cell.focus .clabel{color:#fff;font-weight:600}
.card{position:relative;width:calc(var(--cw)*var(--k));height:calc(var(--ch)*var(--k));border-radius:var(--radius);overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--c1,#334),var(--c2,#112));
  box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);
  transition:transform calc(.2s*var(--speed)) cubic-bezier(.2,.8,.2,1),box-shadow calc(.2s*var(--speed))}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%);pointer-events:none}
.card.big{--cw:340px;--ch:191px}
.card.site{--cw:290px;--ch:163px}
.card.small{--cw:232px;--ch:130px}
.card.qs{--cw:210px;--ch:130px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--line)}
.card.qs.on{background:color-mix(in srgb,var(--accent) 45%,var(--glass))}
.card.qs svg{width:44px;height:44px}
body.tiles-glass .card:not(.add):not(.qs){background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 32%,rgba(255,255,255,.08)),rgba(255,255,255,.04));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.15)}
body.tiles-solid .card:not(.add):not(.qs){background:var(--c2)}
body.tiles-solid .card::after{display:none}
body.shape-square{--radius:6px}
body.shape-round{--radius:36px}
.card .ci{display:grid;place-items:center}
.card .ci.appimg img{width:calc(96px*var(--k));height:calc(96px*var(--k));object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.card.small .ci.appimg img{width:calc(70px*var(--k));height:calc(70px*var(--k))}
.card .ci.glyph svg{width:calc(80px*var(--k));height:calc(80px*var(--k));color:#fff;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.card.small .ci.glyph svg,.card.site .ci.glyph svg{width:calc(60px*var(--k));height:calc(60px*var(--k))}
.card .ci.img{width:calc(92px*var(--k));height:calc(92px*var(--k));border-radius:calc(24px*var(--k));background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.card .ci.img img{width:calc(58px*var(--k));height:calc(58px*var(--k));object-fit:contain}
.card .badge{position:absolute;right:14px;top:14px;font-size:16px;font-weight:800;padding:4px 12px;border-radius:99px;background:#fff;color:#111}
.card.add{background:rgba(255,255,255,.05);border:3px dashed rgba(255,255,255,.28);box-shadow:none}
.card.add::after{display:none}
.card.add svg{width:56px;height:56px;color:var(--muted)}
.card.focused{transform:scale(1.09);box-shadow:0 0 0 4px #fff,0 0 0 9px var(--accent),0 28px 60px rgba(0,0,0,.6);z-index:2}
.card.add.focused svg{color:#fff}

/* ---------- Apps / Websites pages ---------- */
.page-head{position:absolute;left:var(--safe);right:var(--safe);top:calc(var(--safe)*.6 + 112px);display:flex;align-items:center;gap:18px}
.page-head h1{margin:0;font-size:56px;font-weight:700;letter-spacing:-1px}
.page-scroll{position:absolute;left:0;right:0;top:calc(var(--safe)*.6 + 200px);bottom:0;overflow-y:auto;scrollbar-width:none;padding:10px var(--safe) 80px}
.page-scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(232px*var(--k)),1fr));gap:30px 26px;position:relative}
.grid.sites{grid-template-columns:repeat(auto-fill,minmax(calc(290px*var(--k)),1fr))}
.grid .cell{align-items:flex-start}
.search{display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);width:440px}
.search svg{width:24px;height:24px;opacity:.6;flex:none}
.search input{background:none;border:0;outline:0;width:100%;font-size:22px}
.search.focused{background:#fff;color:#111}
.search.focused input{color:#111}
.empty{color:var(--muted);padding:24px 6px;font-size:22px}

/* ---------- App opening splash ---------- */
#loader{position:absolute;inset:0;z-index:60;display:none;place-items:center;background:radial-gradient(60% 60% at 50% 45%,color-mix(in srgb,var(--lc1,#334) 55%,#05060a) 0%,#05060a 75%)}
#loader.open{display:grid;animation:fade calc(.25s*var(--speed)) ease}
.load-box{display:flex;flex-direction:column;align-items:center;gap:30px}
.load-icon{width:200px;height:200px;border-radius:52px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,var(--lc1),var(--lc2));box-shadow:0 40px 110px color-mix(in srgb,var(--lc1) 45%,transparent);animation:breathe 1.6s ease-in-out infinite}
.load-icon.has-img{background:rgba(255,255,255,.06)}
.load-icon.fav{background:#fff}
.load-icon img{width:140px;height:140px;object-fit:contain}
.load-icon svg{width:100px;height:100px;color:#fff}
.load-icon::before{content:"";position:absolute;inset:-20px;border-radius:66px;border:4px solid transparent;border-top-color:rgba(255,255,255,.85);border-right-color:rgba(255,255,255,.25);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
.load-name{font-size:44px;font-weight:700}
.load-sub{color:var(--muted);font-size:24px;margin-top:-18px}
.load-bar{width:320px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.load-bar i{display:block;height:100%;width:40%;border-radius:9px;background:#fff;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}

/* ---------- Boot animation ---------- */
#boot{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .6s ease}
#boot.gone{opacity:0;pointer-events:none}
.boot-box{display:flex;flex-direction:column;align-items:center;gap:30px}
.boot-mark{width:190px;height:190px;border-radius:54px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 30%,#0b1030));box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);animation:bootMark 1.5s cubic-bezier(.2,.8,.2,1) both}
.boot-mark svg{width:140px;height:140px}
@keyframes bootMark{0%{transform:scale(.6);opacity:0;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}45%{opacity:1}70%{transform:scale(1.03);box-shadow:0 0 120px 30px color-mix(in srgb,var(--accent) 35%,transparent)}100%{transform:scale(1);box-shadow:0 0 80px 10px color-mix(in srgb,var(--accent) 22%,transparent)}}
.boot-name{font-size:54px;font-weight:300;letter-spacing:16px;opacity:0;animation:bootName 1.2s .55s ease forwards;padding-left:16px}
@keyframes bootName{from{opacity:0;letter-spacing:30px}to{opacity:1;letter-spacing:16px}}

/* ---------- Screensaver ---------- */
#saver{position:absolute;inset:0;z-index:95;display:none;background:#000;overflow:hidden}
#saver.open{display:block;animation:fade 1.2s ease}
#saverWall{position:absolute;inset:-8%;background-size:cover;background-position:center;opacity:.55;animation:kenburns 60s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.15) translate(-3%,-2%)}}
.saver-clock{position:absolute;transition:left 3s ease,top 3s ease;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.saver-clock .t{font-size:180px;font-weight:200;letter-spacing:-5px;line-height:1;font-variant-numeric:tabular-nums}
.saver-clock .d{font-size:34px;color:rgba(255,255,255,.75);margin-top:10px}

/* ---------- Layers (menus, settings) ---------- */
.layer{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:40px}
.layer.open{display:flex;animation:fade calc(.2s*var(--speed)) ease}
@keyframes fade{from{opacity:0}}
.dlg{width:min(680px,100%);max-height:88%;overflow:auto;background:rgba(22,24,36,.97);border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop calc(.22s*var(--speed)) cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.dlg.wide{width:min(900px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.dlg h3{margin:0 0 6px;font-size:32px}
.dlg p.sub{margin:0 0 22px;color:var(--muted);font-size:21px;line-height:1.45}
.field{display:block;margin:16px 0}
.field>span{display:block;font-size:19px;color:var(--muted);margin-bottom:8px}
.field input:not([type=color]){width:100%;height:64px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 20px;font-size:24px;outline:0}
.field input.focused{box-shadow:0 0 0 4px var(--accent)}
.sheet-list{display:flex;flex-direction:column;gap:10px}
.sheet-btn{display:flex;align-items:center;gap:18px;min-height:72px;padding:10px 22px;border-radius:18px;background:rgba(255,255,255,.06);font-size:23px;text-align:left;transition:all .15s}
.sheet-btn svg{width:28px;height:28px;opacity:.85;flex:none}
.sheet-btn img{width:44px;height:44px;object-fit:contain;flex:none}
.sheet-btn.focused{background:#fff;color:#111}
.sheet-btn.danger{color:#ff8a8a}
.sheet-btn.danger.focused{color:#b91c1c}
.actions{display:flex;gap:14px;justify-content:flex-end;margin-top:24px}
.btn{height:62px;padding:0 30px;border-radius:16px;background:rgba(255,255,255,.08);font-weight:600;font-size:22px;transition:all .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.focused{background:#fff;color:#111;transform:scale(1.05)}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
.gbtn{height:84px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:all .15s}
.gbtn svg{width:38px;height:38px}
.gbtn[aria-pressed="true"]{background:var(--accent)}
.gbtn.focused{background:#fff;color:#111;transform:scale(1.08)}
.list-scroll{max-height:60vh;overflow:auto;padding:6px;scrollbar-width:none}

/* Settings panel */
#settings{justify-content:flex-end;padding:0}
.panel{width:min(840px,100%);height:100%;overflow-y:auto;background:rgba(13,15,23,.97);border-left:1px solid var(--line);padding:calc(var(--safe)*.6 + 20px) 40px 90px;animation:slide calc(.25s*var(--speed)) cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.panel::-webkit-scrollbar,.dlg::-webkit-scrollbar{display:none}
@keyframes slide{from{transform:translateX(60px);opacity:0}}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-head h3{margin:0;font-size:40px}
.stabs{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.chip{height:52px;padding:0 22px;border-radius:99px;font-size:20px;font-weight:600;background:var(--glass-2);border:1px solid var(--line);transition:all .15s;white-space:nowrap}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.chip.focused{background:#fff;color:#111;transform:scale(1.05)}
.group{margin-top:28px}
.group h4{margin:0 0 14px;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:76px;padding:14px 22px;border-radius:18px;background:rgba(255,255,255,.05);margin-bottom:10px;text-align:left;font-size:22px;transition:all .15s}
.opt .hint{display:block;font-size:17px;color:var(--muted);margin-top:4px;line-height:1.4}
.opt .right{flex:none;color:var(--muted);font-size:19px;display:flex;align-items:center;gap:8px}
.opt.focused{background:#fff;color:#111}
.opt.focused .hint,.opt.focused .right{color:#444}
.opt.danger{color:#ff8a8a}
.opt.danger.focused{color:#b91c1c}
.opt .lead{display:flex;align-items:center;gap:16px}
.opt .lead .flag{font-size:36px;line-height:1}
.toggle{flex:none;width:64px;height:38px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;transition:background .2s}
.opt.focused .toggle{background:rgba(0,0,0,.18)}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
[aria-pressed="true"] .toggle,.opt.focused[aria-pressed="true"] .toggle{background:var(--accent)}
[aria-pressed="true"] .toggle::after{transform:translateX(26px)}
.swatches{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sw{width:60px;height:60px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px #fff}
.sw.focused{transform:scale(1.18);box-shadow:0 0 0 4px var(--accent),0 0 0 8px #fff}
.sw.custom{background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.wp{height:96px;border-radius:16px;position:relative;overflow:hidden;font-size:17px;font-weight:600;display:flex;align-items:flex-end;padding:8px 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .15s,box-shadow .15s;background-size:cover;background-position:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wp[aria-pressed="true"]{box-shadow:0 0 0 4px #fff}
.wp.focused{transform:scale(1.06);box-shadow:0 0 0 4px var(--accent),0 0 0 8px #fff}
.wp.upload{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.3);justify-content:center;align-items:center}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;height:60px;border-radius:16px;background:rgba(255,255,255,.06);font-weight:600;font-size:20px;transition:all .15s;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button.focused{background:#fff;color:#111;transform:scale(1.04)}
.seg-label{font-size:20px;margin:18px 2px 10px;color:rgba(255,255,255,.85)}
.card-note{border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:18px 22px;margin-bottom:10px;font-size:19px;line-height:1.5;color:rgba(255,255,255,.85)}
.card-note b{color:#fff}
.statusline{display:flex;align-items:center;gap:14px;padding:20px 22px;border-radius:18px;background:rgba(255,255,255,.05);margin-bottom:10px;font-weight:600;font-size:21px}
.dot{width:14px;height:14px;border-radius:50%;background:#6b7280;flex:none}
.dot.ok{background:#22c55e;box-shadow:0 0 12px #22c55e}
.dot.busy{background:#f59e0b;animation:blink 1s infinite}
.dot.err{background:#ef4444}
@keyframes blink{50%{opacity:.3}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;font-size:20px;align-items:center}
.about{margin-top:34px;color:var(--faint);font-size:18px;line-height:1.6}

#toast{position:absolute;left:50%;bottom:calc(var(--safe) + 20px);transform:translate(-50%,24px);opacity:0;z-index:110;background:rgba(20,22,32,.96);border:1px solid var(--line);padding:18px 28px;border-radius:20px;font-size:23px;transition:all .25s;pointer-events:none;max-width:80%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

body.size-s{--k:.85} body.size-l{--k:1.15}
body.motion-off *{animation:none!important;transition:none!important}
body.portrait #hero{height:calc(var(--H)*.34 - var(--safe)*.6 - 112px)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const w = f.want; if(!w) return null;
  if(w.pkgs){ for(const p of w.pkgs){ const hit = APPS.find(a => a.pkg === p); if(hit) return hit; } }
  if(w.match){ const re = new RegExp(w.match, "i"); return APPS.find(a => re.test(a.name)) || null; }
  return null;
}

/* ---------- App opening splash ---------- */
let splashTimer = null;
function splash(f, go){
  if(!S.splash){ Sound.play("launch"); go(); return; }
  const c = itemColors(f), L = $("#loader"), box = $("#loadIcon");
  L.style.setProperty("--lc1", c[0]); L.style.setProperty("--lc2", c[1]);
  const ic = iconFor(f);
  box.className = "load-icon"; box.replaceChildren();
  if(ic.type === "glyph") box.append(svg(G[ic.glyph] || G.grid));
  else { box.classList.add("has-img"); if(ic.type === "img") box.classList.add("fav"); const img = el("img",{alt:"",src:ic.src}); img.onerror = () => { box.className = "load-icon"; img.replaceWith(svg(G[ic.glyph] || G.grid)); }; box.append(img); }
  $("#loadName").textContent = displayName(f);
  L.classList.add("open");
  Sound.play("launch");
  clearTimeout(splashTimer);
  setTimeout(go, S.motion === "off" ? 150 : 750);
  splashTimer = setTimeout(hideSplash, NATIVE ? 9000 : 1800);
}
function hideSplash(){ $("#loader").classList.remove("open"); }

  const n = String(name).toLowerCase();

/* ---------- Row carousel: the focused row slides to the top ---------- */
let activeRow = 0;
function snapRows(){
  if(page !== "home") return;
  const rows = [...document.querySelectorAll("#rows .row")].filter(r => !r.hidden);
  rows.forEach((r, i) => r.classList.toggle("past", i < activeRow));
  const r = rows[Math.min(activeRow, rows.length-1)];
  $("#rows").style.transform = r ? `translateY(${-r.offsetTop}px)` : "";
}
function rowOf(n){ const r = n.closest && n.closest("#rows .row"); if(!r) return -1; return [...document.querySelectorAll("#rows .row")].filter(x => !x.hidden).indexOf(r); }

function setAdblock(on, silent){

/* =====================================================================
   Layers
   ===================================================================== */
const layerStack = [], returnFocus = [];
function openLayer(id){
  const L = $("#"+id);
  returnFocus.push(document.activeElement);
  L.style.zIndex = 20 + layerStack.length * 2;   // newest menu always on top
  L.classList.add("open"); layerStack.push(L);
  requestAnimationFrame(() => { const first = navItems()[0]; first && focusEl(first, true); });
}
function closeTop(silent){
  const L = layerStack.pop(); if(!L) return false;
  L.classList.remove("open");
  if(!silent) Sound.play("back");
  const back = returnFocus.pop();
  if(back && document.contains(back) && back.getClientRects().length) focusEl(back, true); else { const f = navItems()[0]; f && focusEl(f, true); }
  return true;
}
function closeAll(){ while(layerStack.length) closeTop(true); }
for(const id of ["sheet","form","confirm","settings","picker"]) $("#"+id).addEventListener("click", e => { if(e.target.id === id) closeTop(); });
function sheet(title, sub, items){
  $("#sheetTitle").textContent = title; $("#sheetSub").textContent = sub || "";
  const list = $("#sheetList"); list.replaceChildren();
  for(const it of items.filter(Boolean)){
    const [label, ic, fn, cls] = it;
    const b = el("button",{class:"sheet-btn " + (cls||""), "data-nav":true}, svg(ic), label);
    b.addEventListener("click", () => { closeTop(true); fn(); });
    list.append(b);
  }
  openLayer("sheet");
}
function confirmBox(title, sub, okLabel, fn){
  $("#cTitle").textContent = title; $("#cSub").textContent = sub; $("#cYes").textContent = okLabel;
  $("#cYes").onclick = () => { closeTop(true); fn(); };
  $("#cNo").onclick = () => closeTop();
  openLayer("confirm");
}
function picker(title, sub, body){ $("#pTitle").textContent = title; $("#pSub").textContent = sub || ""; $("#pBody").replaceChildren(body); $("#pClose").onclick = () => closeTop(); openLayer("picker"); }
function openIconPicker(row, i){

function shade(hex, amt){ const n = parseInt(hex.slice(1),16); const f = v => Math.max(0, Math.min(255, Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt))); return "#" + [n>>16,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,"0")).join(""); }
function colorSwatch(get, set){

  const inp = el("input",{type:"color", value:get()});

  if(Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.3){
    if(!document.activeElement.closest || !document.activeElement.closest("#rows")){ const f = $("#favs .card"); f && focusEl(f, true); }
    move(dy < 0 ? "down" : "up");
  }
}, {passive:true});

window.ALBack = function(){
  if(!$("#boot").classList.contains("gone")){ endBoot(); return true; }
  if($("#loader").classList.contains("open")){ hideSplash(); return true; }
  if(closeTop()) return true;
  Sound.play("back");
  if(page !== "home"){ setPage("home"); return true; }
  const t = $("#favs .card");
  if(activeRow !== 0 || document.activeElement !== t){ t && focusEl(t, true); }
  return true;
};
window.ALHome = function(){ hideSplash(); hideSaver(); closeAll(); if(page !== "home") setPage("home"); const t = $("#favs .card"); t && focusEl(t, true); };

/* =====================================================================
   Start
   ===================================================================== */
function endBoot(){ const b = $("#boot"); if(b.classList.contains("gone")) return; b.classList.add("gone"); const t = $("#favs .card"); t && focusEl(t, true); idleReset(); }
if(NATIVE && S.ui === "android") location.replace("classic.html");
$("#brandMark").innerHTML = LOGO;
$("#bootMark").innerHTML = LOGO;
$("#settingsBtn").append(svg(UI.gear));
fit(); applyLook(); drawIdleHero(true); tick(); setInterval(tick, 1000);
drawRows(); drawQS(); drawApps(); onNet();
call("setLandscape", S.landscape);
if(NATIVE){
  call("requestApps", false);
  try{ const st = JSON.parse(call("netStatus") || "null"); if(st) window.ALOnNet(st); }catch(e){}
}else setTimeout(() => window.ALOnApps(SAMPLE_APPS), 300);
if(S.boot && S.motion !== "off"){ setTimeout(() => Sound.play("start"), 250); setTimeout(endBoot, 2300); }
else { $("#boot").classList.add("gone"); requestAnimationFrame(() => { const t = $("#favs .card"); t && focusEl(t, true); }); }
</script>
</body>
</html>
